<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroAI Chat</title>
</head><body style="background:#0f172a;color:white;font-family:Arial;padding:20px;"><h2>🤖 BroAI Assistant</h2><input type="text" id="userInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button><div id="chat-box" style="margin-top:20px;"></div><script>
function sendMessage() {

var input = document.getElementById("userInput");
var chatBox = document.getElementById("chat-box");

if (input.value === "") {
return;
}

chatBox.innerHTML += "<p><b>You:</b> " + input.value + "</p>";

chatBox.innerHTML += "<p><b>Bot:</b> Demo Response - " + input.value + "</p>";

input.value = "";
}
</script></body>
</html>
