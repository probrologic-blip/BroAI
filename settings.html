<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroAI Settings</title>

<link rel="stylesheet" href="style.css">

<style>

.settings-container{
max-width:700px;
margin:40px auto;
background:#1e293b;
padding:30px;
border-radius:20px;
}

.settings-container h1{
text-align:center;
margin-bottom:25px;
}

.setting-box{
margin-bottom:20px;
}

.setting-box label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

.setting-box input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
}

.save-btn,
.reset-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
color:white;
font-size:16px;
}

.save-btn{
background:#8b5cf6;
}

.reset-btn{
background:#ef4444;
}

.back-btn{
display:block;
text-align:center;
margin-top:20px;
color:#8b5cf6;
text-decoration:none;
font-weight:bold;
}

</style>

</head>
<body>

<div class="settings-container">

<h1>⚙️ Settings</h1>

<div class="setting-box">
<label>Name</label>
<input type="text" id="userName" placeholder="Enter your name">
</div>

<div class="setting-box">
<label>Email</label>
<input type="email" id="userEmail" placeholder="Enter your email">
</div>

<button class="save-btn" onclick="saveSettings()">
Save Settings
</button>

<button class="reset-btn" onclick="resetCredits()">
Reset Credits To 100
</button>

<a href="dashboard.html" class="back-btn">
⬅ Back To Dashboard
</a>

</div>

<script>

document.getElementById("userName").value =
localStorage.getItem("broai_name") || "";

document.getElementById("userEmail").value =
localStorage.getItem("broai_email") || "";

function saveSettings(){

let name =
document.getElementById("userName").value;

let email =
document.getElementById("userEmail").value;

localStorage.setItem("broai_name", name);
localStorage.setItem("broai_email", email);

alert("Settings Saved Successfully!");

}

function resetCredits(){

localStorage.setItem("broai_credits", "100");

alert("Credits Reset To 100");

}

<script src="script.js"></script>

</body>
</html>
