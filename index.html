<!DOCTYPE html>
<html>
<head>
  <title>BroAI</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; margin:0; }

    #chatBox {
      height: 85vh;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
      max-width: 70%;
    }

    .user { background:#2563eb; margin-left:auto; }
    .bot { background:#1f2937; }

    .inputBox {
      display:flex;
      position:fixed;
      bottom:0;
      width:100%;
      background:#111827;
      padding:10px;
    }

    input {
      flex:1;
      padding:10px;
      border:none;
      outline:none;
    }

    button {
      padding:10px 20px;
      background:#38bdf8;
      border:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div id="chatBox">
  <div class="msg bot">Hi 👋 I am BroAI</div>
</div>

<div class="inputBox">
  <input id="input" type="text" placeholder="Type message...">
  <button onclick="sendMsg()">Send</button>
</div>

<script src="script.js"></script>

</body>
</html>
