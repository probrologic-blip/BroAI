<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroAI Login</title>

<link rel="stylesheet" href="style.css">

<style>

.auth-container{
max-width:450px;
margin:80px auto;
background:#1e293b;
padding:30px;
border-radius:15px;
}

.auth-container h1{
text-align:center;
margin-bottom:25px;
}

.auth-container input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:10px;
}

.auth-btn{
width:100%;
padding:14px;
background:#8b5cf6;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.auth-link{
text-align:center;
margin-top:15px;
}

.auth-link a{
color:#8b5cf6;
text-decoration:none;
}

</style>

</head>

<body>

<div class="auth-container">

<h1>🔐 Login</h1>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button class="auth-btn" onclick="loginUser()">
Login
</button>

<div class="auth-link">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

<script>

function loginUser(){

if(localStorage.getItem("broai_credits") === null){
localStorage.setItem("broai_credits","100");
}

localStorage.setItem("broai_user","loggedin");

window.location.href="dashboard.html";

}

<script src="script.js"></script>

</body>
</html>
