<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - BroAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      color: white;
    }

    .login-form {
      width: 90%;
      max-width: 380px;
      padding: 35px;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #06111a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 14px;
    }

    .signup a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <form class="login-form">

    <div class="logo">BroAI</div>

    <p class="subtitle">
      Your AI workspace
    </p>

    <h2>Welcome Back 👋</h2>

    <div class="field">
      <label>Username</label>
      <input
        type="text"
        placeholder="Enter your username"
        required
      >
    </div>

    <div class="field">
      <label>Password</label>
      <input
        type="password"
        placeholder="Enter your password"
        required
      >
    </div>

    <button class="login-btn" type="submit">
      Login to BroAI
    </button>

    <p class="signup">
      Don't have an account?
      <a href="signup.html">Sign up</a>
    </p>

    <a class="back" href="index.html">
      ← Back to BroAI
    </a>

  </form>

</body>
</html>
