<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroAI Sign Up</title>
<link rel="stylesheet" href="style.css"><style>

.auth-container{
max-width:450px;
margin:80px auto;

.auth-container h1{
text-align:center;
margin-bottom:25px;
}

.auth-container input{

}

.auth-btn{

padding:14px;

}

.auth-link a{

}

</style></head><body><div class="auth-container"><h1>🚀 Create Account</h1><input type="text" placeholder="Full Name"><input type="email" placeholder="Email"><input type="password" placeholder="Password"><button class="auth-btn">

<button class="auth-btn" onclick="signupUser()">

</button>

</div>
</div>
 
  <script>

function signupUser(){

localStorage.setItem("broai_user","loggedin");

}

</script>

</body>
</html>
